security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js|uploads)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\UserAuthenticator
      logout:
        path: app_logout
        target: app_index
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800
        path: /

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/signup, roles: PUBLIC_ACCESS }
    - { path: ^/produit/new, roles: ROLE_USER }
    - { path: ^/produit/.+/edit, roles: ROLE_USER }
    - { path: ^/fournisseur, roles: ROLE_USER }
    - { path: ^/commande, roles: ROLE_USER }
    - { path: ^/ligne, roles: ROLE_USER }
    - { path: ^/avis, roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
